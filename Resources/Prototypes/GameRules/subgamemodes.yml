- type: entity
  parent: BaseGameRule
  id: Thief
  components:
  - type: ThiefRule
  - type: AntagObjectives
    objectives:
    - EscapeThiefShuttleObjective
  - type: AntagRandomObjectives
    sets:
    - groups: ThiefBigObjectiveGroups
      prob: 0.7
      maxPicks: 1
    - groups: ThiefObjectiveGroups
      maxPicks: 10
    maxDifficulty: 2.5
  - type: AntagSelection
    agentName: thief-round-end-agent-name
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Thief ]
      max: 3
      playerRatio: 15
      chaosScore: 100 # Goobstation
      lateJoinAdditional: true
      allowNonHumans: true
      multiAntagSetting: NotExclusive
      startingGear: ThiefGear
      jobBlacklist: [ Chaplain ] # GOOBSTATION
      blacklist: # GOOBSTATION
        components:
        - CommandStaff
      components:
      - type: Pacified
      - type: Thieving
        stripTimeReduction: 2
        stealthy: true
      mindRoles:
      - MindRoleThief
      briefing:
        sound: "/Audio/Misc/thief_greeting.ogg"
  - type: DynamicRuleCost
    cost: 75

- type: entity
  parent: BaseGameRule
  id: Spy
  components:
  - type: SpyRule
    lootPool:
    - Telecrystal10
    - Telecrystal5
    - PowerCellHyper
    - SpaceCash5000
    - SpaceCash10000
    - CombatKnife
    - Emag
    - StealthBox
    - ChameleonProjector
    - JetpackMiniFilled
  - type: AntagObjectives
    objectives:
    - SpyEscapeShuttleMission
  - type: AntagRandomObjectives
    sets:
    - groups: SpyMissionGroups
      prob: 0.9
      maxPicks: 2
    maxDifficulty: 2.5
  - type: AntagSelection
    agentName: spy-round-end-agent-name
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Spy ]
      max: 1
      playerRatio: 15
      chaosScore: 100 # Goobstation
      lateJoinAdditional: true
      allowNonHumans: true
      multiAntagSetting: NotExclusive
      startingGear: SpyGear
      jobBlacklist: [ Chaplain ] # GOOBSTATION
      blacklist: # GOOBSTATION
        components:
        - CommandStaff
      mindRoles:
      - MindRoleSpy
      briefing:
        text: spy-role-greeting
        color: Teal
  - type: DynamicRuleCost
    cost: 75
