# Big missions

- type: entity
  parent: [BaseSpyObjective, BaseLivingObjective]
  id: SpyEscapeShuttleMission
  name: Escape to CentComm alive and unrestrained via the escape shuttle.
  description: My employer wants the intel out of the station. Don't show up in cuffs.
  components:
  - type: Objective
    difficulty: 1.3
    icon:
      sprite: Structures/Furniture/chairs.rsi
      state: shuttle
  - type: EscapeShuttleCondition

- type: entity
  parent: [BaseSpyObjective, BaseKillObjective]
  id: SpyKillMission
  description: This target has become a problem for my employer. Make sure they never reach CentComm.
  components:
  - type: Objective
    difficulty: 1.75
    unique: false
  - type: SpyBounty
    difficulty: Hard
  - type: TargetObjective
    title: objective-condition-maroon-person-title
  - type: PickRandomPerson
    filters:
    # Can't have multiple missions to kill the same person.
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - KillPersonCondition
  - type: KillPersonCondition
    requireMaroon: true

