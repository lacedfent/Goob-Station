- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseSpyObjective
  components:
  - type: Objective
    issuer: objective-issuer-spy
  - type: RoleRequirement
    roles:
    - SpyRole
  - type: SpyBounty

- type: entity
  abstract: true
  parent: [BaseSpyObjective, BaseStealObjective]
  id: BaseSpyStealObjective
  components:
  - type: StealCondition
    verifyMapExistence: false
    descriptionText: objective-condition-spy-description

- type: entity
  abstract: true
  parent: [BaseSpyObjective, BaseStealObjective]
  id: BaseSpyStealStructureObjective
  components:
  - type: StealCondition
    verifyMapExistence: true
  - type: Objective
    difficulty: 2 # it's hard to hide

- type: entity
  abstract: true
  parent: [BaseSpyObjective, BaseStealObjective]
  id: BaseSpyStealAnimalObjective
  components:
  - type: StealCondition
    verifyMapExistence: true
    checkAlive: true
    objectiveNoOwnerText: objective-condition-steal-title-alive-no-owner
    descriptionText: objective-condition-spy-animal-description
  - type: Objective
    difficulty: 2 # it's hard to hide

